apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: default
data:
  config.yml: |
    server:
      http_listen_port: 9080

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki-logs:3100/loki/api/v1/push

    scrape_configs:
      - job_name: containers
        static_configs:
          - targets:
              - localhost
            labels:
              job: varlogs
              __path__: /var/log/*.log

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: default
  labels:
    monitoring: promtail
spec:
  replicas: 1
  selector:
    matchLabels:
      monitoring: promtail
  template:
    metadata:
      labels:
        monitoring: promtail
    spec:
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - "-config.file=/etc/promtail/config.yml"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail/config.yml
              subPath: config.yml

      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config

      nodeSelector:
        cloud.google.com/compute-class: autopilot