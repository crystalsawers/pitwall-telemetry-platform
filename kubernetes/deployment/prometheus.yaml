apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: fastapi
        metrics_path: /metrics
        static_configs:
          - targets: ["fastapi-app-service:8000"]

        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
          - target_label: job
            replacement: fastapi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
  labels:
    monitoring: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      monitoring: prometheus
  template:
    metadata:
      labels:
        monitoring: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              ephemeral-storage: 1Gi

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

      nodeSelector:
        cloud.google.com/compute-class: autopilot

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
spec:
  selector:
    monitoring: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  type: ClusterIP